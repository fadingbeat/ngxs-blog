<button (click)="navigateToAdd()" mat-fab class="mat-fab-add">
  <mat-icon>add</mat-icon>
</button>
<div class="table-wrapper" *ngIf="posts">
  <table mat-table [dataSource]="posts.data">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>Id</th>
      <td mat-cell *matCellDef="let post">{{ post.id }}</td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let post">{{ post.attributes.title }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let post">{{ post.attributes.description }}</td>
    </ng-container>

    <ng-container matColumnDef="content">
      <th mat-header-cell *matHeaderCellDef>Content</th>
      <td mat-cell *matCellDef="let post">
        {{ post.attributes.content || "-" }}
      </td>
    </ng-container>

    <ng-container matColumnDef="datePosted">
      <th mat-header-cell *matHeaderCellDef>Date Posted</th>
      <td mat-cell *matCellDef="let post">{{ post.attributes.datePosted || "-" }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let post">
        <button (click)="editPost(post.id)" mat-icon-button>
          <mat-icon>edit</mat-icon>
        </button>
        <button (click)="deletePost(post.id)" mat-icon-button>
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="visibleColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: visibleColumns"></tr>
  </table>


  <mat-paginator [length]="posts.totalItems" [pageSize]="posts.perPage" [pageSizeOptions]=" [1, 5, 20, 30]"
    (page)=" onPaginateChange($event)" aria-label="Select page" showFirstLastButtons>
  </mat-paginator>
  <div *ngIf="spinnerLoading" class="spinner-wrapper">
    <mat-spinner></mat-spinner>
  </div>
</div>
